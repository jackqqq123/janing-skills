<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skill Evaluation Report</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:2rem;color:#18212f;background:#f7f9fc}h1,h2{color:#12355b}.meta,.case{background:#fff;border:1px solid #d8e0ea;border-radius:8px;padding:1rem;margin:1rem 0}.pass{color:#087f3f}.fail{color:#bc2635}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}pre{white-space:pre-wrap;overflow:auto;background:#f1f4f8;padding:.75rem;border-radius:4px}
</style>
</head>
<body>
<h1>Skill Evaluation Report</h1>
<div id="app"></div>
<script>
const data = window.__EVAL_RESULTS__={"skill":"example-skill","generatedAt":"2026-04-20T00:00:00Z","limitations":["Sample fixture only; no model execution occurred.","Three illustrative cases are not statistically significant."],"cases":[{"id":"create-success","baseline":{"summary":"No reusable structure"},"withSkill":{"summary":"Produced a valid DSH skill plan"},"assertions":[{"status":"pass","message":"Includes required kebab-case frontmatter"}],"review":{"verdict":"pass","rationale":"Expected structure is present."}},{"id":"project-path-boundary","baseline":{"summary":"Suggested .agents/.skills"},"withSkill":{"summary":"Corrected to .agents/skills"},"assertions":[{"status":"pass","message":"Uses the default project skills path"}],"review":{"verdict":"pass","rationale":"Correct path and precedence stated."}},{"id":"ordinary-task-non-trigger","baseline":{"summary":"Normal coding response"},"withSkill":{"summary":"Did not load skill creator"},"assertions":[{"status":"pass","message":"Avoids irrelevant invocation"}],"review":{"verdict":"pass","rationale":"Boundary is respected."}}]};
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cases = data.cases || [];
let passed = 0, total = 0;
for (const item of cases) {
  for (const a of (item.assertions || [])) { total++; if (a.status === 'pass') passed++; }
}
const limitations = (data.limitations || []).map(x => `<li>${esc(x)}</li>`).join('');
const cards = cases.map(item => {
  const assertions = (item.assertions || []).map(a => `<li class="${a.status === 'pass' ? 'pass' : 'fail'}">${esc(a.status)} — ${esc(a.message)}</li>`).join('');
  return `<section class="case"><h2>${esc(item.id)}</h2>
    <div class="grid">
      <div><h3>Baseline</h3><pre>${esc(JSON.stringify(item.baseline, null, 2))}</pre></div>
      <div><h3>With skill</h3><pre>${esc(JSON.stringify(item.withSkill, null, 2))}</pre></div>
    </div>
    <h3>Assertions</h3><ul>${assertions}</ul>
    <h3>Independent review</h3><pre>${esc(JSON.stringify(item.review, null, 2))}</pre>
  </section>`;
}).join('');
document.querySelector('#app').innerHTML =
  `<section class="meta"><b>Skill:</b> ${esc(data.skill)}<br>` +
  `<b>Generated:</b> ${esc(data.generatedAt)}<br>` +
  `<b>Assertions:</b> ${passed}/${total} passed<br>` +
  `<b>Limitations:</b><ul>${limitations}</ul></section>` + cards;
</script>
</body>
</html>
